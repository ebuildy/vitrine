# The Settings of `npm run demo`. Secrets come from .env.
# The fake Sources listen on free ports: demo/start.ts writes these Settings to demo/.settings-<pid>.yaml with each url replaced.

sources:
  - name: main-harbor
    type: harbor
    url: http://127.0.0.1:0
    projects:
      - platform
      - library
    username: robot$vitrine
    passwordEnv: HARBOR_PASSWORD
  # Anonymous read access, so no secret.
  - name: tools-harbor
    type: harbor
    url: http://127.0.0.1:0
    projects:
      - tools
  - name: main-gitlab
    type: gitlab
    url: http://127.0.0.1:0
    mainGroups:
      - platform
      - data/analytics
    tokenEnv: GITLAB_TOKEN
  # Anonymous read access, and no selection of Repositories: every one it reports is shown.
  - name: main-nexus
    type: nexus
    url: http://127.0.0.1:0

# Restarting the demo starts from its seed data. Use `type: redis` with `urlEnv: REDIS_URL` to try the shared store,
# and a keyPrefix of its own in each worktree, as every worktree shares the Valkey of compose.yaml.
cacheStore:
  type: memory

branding:
  siteName: Vitrine demo

navigation:
  - label: Platform
    url: /
  - label: Images
    url: /images
    icon: harbor
  - label: Roadmap
    url: /roadmap/platform
    icon: ":rocket:"
  - label: Issues
    url: /issues/platform
  - label: Search
    url: /search
  - label: Repositories
    url: /nexus/main-nexus

# The naval Theme: a crisp layout in ocean blues, with a sea of drifting waves, boats and submarines at the foot of every page.
theme:
  name: naval
  # Your own CSS wins over the Theme's. See settings.example.yaml for files and URLs.
  css:
    - |
      .site-name { letter-spacing: 0.08em; text-transform: uppercase; }

routes:
  - url: /
    controller: navigation
  - url: /overview
    controller: navigation
    params:
      arrangement: columns
      maxItems: 3
  - url: /images
    controller: harbor-images
  - url: /images/tools
    controller: harbor-images
    params:
      source: tools-harbor
  # A Template rearranges a page. See settings.example.yaml for what one can use.
  - url: /welcome
    controller: harbor-images
    template: |
      ---
      const harbors = sources.filter(({ type }) => type === 'harbor');
      ---
      <h1 class="welcome">Welcome to the demo</h1>
      <p>A Template in demo/settings.yaml arranges what you see here.</p>
      {harbors.map(({ name, projects }) => (
        <section>
          <h2>{name}</h2>
          {projects.map((project) => <ImageList source={name} project={project} />)}
        </section>
      ))}
      <style>
        .welcome { color: teal; }
      </style>
  - url: /harbor/:source
    controller: harbor
    template: |
      <h1>{source}</h1>
      <HarborProjectList source={source} />
      <GitlabGroupList source="main-gitlab" group="platform" />
  - url: /harbor/:source/:project
    controller: harbor-images
  - url: /gitlab/:group+
    controller: gitlab-group
  - url: /gitlab/:group+/-/:project
    controller: gitlab-project
  - url: /roadmap/:group+
    controller: gitlab-roadmap
  - url: /issues/:group+
    controller: gitlab-issues
  - url: /search
    controller: search
  - url: /nexus/:source
    controller: nexus
