# Loki for local work: one process, files on a volume, no authentication.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

ingester:
  # A throwaway store has no use for a write-ahead log, which also stops writes when the disk is more than 90% full.
  wal:
    enabled: false

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # The backfilled logs are 7 days old, and arrive all at once.
  reject_old_samples: false
  ingestion_rate_mb: 128
  ingestion_burst_size_mb: 256
  per_stream_rate_limit: 128MB
  per_stream_rate_limit_burst: 256MB
  max_query_series: 5000
  volume_enabled: true
  shard_streams:
    enabled: false

analytics:
  reporting_enabled: false
