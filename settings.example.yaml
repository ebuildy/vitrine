# Copy this file to settings.yaml, then replace the values with your own.
# settings.yaml is ignored by git: never commit real hostnames.

sources:
  - name: main-harbor
    type: harbor
    url: https://harbor.example.com
    # The Harbor projects whose Images appear in Vitrine.
    projects:
      - library
      - platform
    # Leave out username and passwordEnv for a Harbor project with anonymous read access.
    username: robot$vitrine
    # The name of the environment variable holding the password, never the password itself.
    passwordEnv: HARBOR_PASSWORD
    # How long content from this Source is served without asking it again. Defaults to 15, and 0 disables the cache.
    allowedAgeMinutes: 15
  # Declare as many Sources as you run.
  - name: tools-harbor
    type: harbor
    url: https://tools-harbor.example.com
    projects:
      - tools

# Where content read from Sources is kept. Defaults to memory.
cacheStore:
  # memory loses everything on restart.
  type: memory
  # files keeps content across a restart when the directory is on a persistent volume:
  # type: files
  # directory: /var/cache/vitrine
  # redis keeps content across a restart of Vitrine, and is the only store replicas can share.
  # Stale content survives only if the server persists its data and never evicts keys:
  # type: redis
  # The name of the environment variable holding the connection URL, never the URL itself.
  # urlEnv: REDIS_URL

routes:
  # Shows the Images of every selected Harbor project of every Source.
  - url: /images
    controller: harbor-images
  # The source parameter limits a Route to one Source.
  - url: /images/tools
    controller: harbor-images
    params:
      source: tools-harbor
  # A :source or :project segment takes its value from the URL.
  # The harbor Controller lists every Harbor project the Source reports, whatever projects says above,
  # so give the Source a token that only reads what Visitors may see. It links them to the Route below.
  - url: /harbor/:source
    controller: harbor
  - url: /harbor/:source/:project
    controller: harbor-images
