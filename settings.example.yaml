# Copy this file to settings.yaml, then replace the values with your own.
# settings.yaml is ignored by git: never commit real hostnames.
# Environment variables named below can also live in a .env file, see .env.example.

sources:
  - name: main-harbor
    type: harbor
    url: https://harbor.example.com
    # The Harbor projects whose Images appear in Vitrine.
    projects:
      - library
      - platform
    # Leave out username and passwordEnv for a Harbor project with anonymous read access.
    username: robot$vitrine
    # The name of the environment variable holding the password, never the password itself.
    passwordEnv: HARBOR_PASSWORD
    # How long content from this Source is served without asking it again. Defaults to 15, and 0 disables the cache.
    allowedAgeMinutes: 15
  # Declare as many Sources as you run.
  - name: tools-harbor
    type: harbor
    url: https://tools-harbor.example.com
    projects:
      - tools
  - name: main-gitlab
    type: gitlab
    url: https://gitlab.example.com
    # The Groups Vitrine aggregates, with everything beneath them. Anything else is not found.
    mainGroups:
      - platform
      - data/analytics
    # The name of the environment variable holding a token, never the token itself.
    # Vitrine shows whatever the token can read, so give it read_api on what Visitors may see.
    # Leave it out for a Main Group with anonymous read access.
    tokenEnv: GITLAB_TOKEN
    allowedAgeMinutes: 15

# Where content read from Sources is kept. Defaults to memory.
cacheStore:
  # memory loses everything on restart.
  type: memory
  # files keeps content across a restart when the directory is on a persistent volume:
  # type: files
  # directory: /var/cache/vitrine
  # redis keeps content across a restart of Vitrine, and is the only store replicas can share.
  # Stale content survives only if the server persists its data and never evicts keys:
  # type: redis
  # The name of the environment variable holding the connection URL, never the URL itself.
  # urlEnv: REDIS_URL
  # Installations sharing one Redis each need their own prefix for their keys. Defaults to vitrine:
  # keyPrefix: vitrine:

# The site name and logo at the top of every page. Defaults to the name Vitrine and no logo.
branding:
  siteName: Acme Portal
  # Starts with http://, https:// or /. The Container image serves no files of its own, so host the logo elsewhere.
  logo: https://cdn.example.com/logo.svg

# The Menu at the top of every page, in this order. A url starts with http://, https:// or /.
navigation:
  - label: Images
    url: /images
  - label: Handbook
    url: https://docs.example.com/

# name picks a complete Theme, with its own colours and decorations. Leave it out for the plain default.
# Every Theme, the default too, has a light and a dark mode. Each Visitor's system picks one, unless the Visitor
# picks another with the menu at the top right, which their browser remembers.
#   naval: a crisp layout in ocean blues, with a sea of drifting waves, boats and submarines at the foot of every page.
# The colours are any CSS colour, and win over those of the named Theme: those at the top for light mode, and
# those under dark for dark mode. Quote a hex colour, as YAML reads # as a comment. Each one you leave out keeps
# the Theme's own for that mode.
# Components use them as the CSS variables --color-primary, --color-background, --color-text and --color-border,
# and a Template can do the same.
theme:
  name: naval
  # Links, card highlights and Roadmap bars.
  primary: '#00795c'
  background: '#ffffff'
  text: '#1e1e3c'
  border: '#c8d0d8'
  dark:
    primary: '#4fd1a5'
    background: '#0d1b2a'
    text: '#e6edf3'
    border: '#2a3a4a'
  # Your own CSS, after Vitrine's and the named Theme's so that it wins, in this order. Each item is one of:
  #   - a URL starting with http://, https:// or /, which the browser loads
  #   - a file starting with ./ or ../, beside this file, read when Vitrine starts: a change needs a restart
  #   - CSS code, told apart by its {
  # Every card has the class card, so that one rule styles them all, as in .card { border-radius: 0; }.
  # Each part of a Project page is a title above a card, in a .project-part: .project-readme, .project-commits, .project-issues, .project-releases and .project-contributors.
  # Like a Template, CSS runs in every Visitor's browser, so only let people trusted with the site edit it.
  css:
    - https://cdn.example.com/brand.css
    # Startup stops on a file that does not exist, so create vitrine.css before you uncomment this line.
    # - ./vitrine.css
    - |
      h1 { letter-spacing: 0.02em; }

routes:
  # Shows the latest releases, Harbor projects, Members and Groups of every Source, and leads to the other pages.
  # Add as many of these as you like, on any URL, even the root one.
  - url: /
    controller: navigation
    params:
      # grid sets releases and Harbor projects side by side above the rest, which is the default. columns gives
      # the Overview, Members and Groups a column each, and list runs everything down the page.
      arrangement: grid
      # How many items each list shows. Defaults to 5.
      maxItems: 5
  # Shows the Images of every selected Harbor project of every Source.
  - url: /images
    controller: harbor-images
  # The source parameter limits a Route to one Source.
  - url: /images/tools
    controller: harbor-images
    params:
      source: tools-harbor
  # A :source or :project segment takes its value from the URL.
  # The harbor Controller lists every Harbor project the Source reports, whatever projects says above,
  # so give the Source a token that only reads what Visitors may see. It links them to the Route below.
  - url: /harbor/:source
    controller: harbor
  - url: /harbor/:source/:project
    controller: harbor-images
  # A :group+ segment takes one URL segment or more, as Groups nest. The Source is the first one
  # whose Main Groups hold the Group: when two Sources share a Group path, put :source in the URL too.
  - url: /gitlab/:group+
    controller: gitlab-group
  # Like GitLab, a "-" ends the Group path, as in /gitlab/platform/backend/-/api.
  - url: /gitlab/:group+/-/:project
    controller: gitlab-project
  # Shows the open Issues of a Group and of everything beneath it, read once per Main Group.
  - url: /issues/:group+
    controller: gitlab-issues
  # Searches every Group, Project, Issue, Member and Epic of every Main Group and every Image of every selected Harbor
  # project from one box, filtered by content type and by Source. It answers from the lists the other pages cache, so a
  # search costs the Sources nothing while they are fresh. A word may have one letter wrong. Results follow the box
  # as a Visitor types, 2 seconds after the last key.
  - url: /search
    controller: search
  # Shows the open Epics of a Main Group and of everything beneath it on a timeline. Any other Group is not found.
  # Epics need GitLab 18.1 or later on a tier that includes them. Otherwise the Roadmap shows an error.
  - url: /roadmap/:group+
    controller: gitlab-roadmap
  # A Template rearranges what a Controller shows inside the page, on any Route. It is Astro markup, compiled when
  # Vitrine starts, so a change needs a restart and no rebuild. The Controller keeps not found, the "could not be
  # loaded" page, the page title and <head>. A YAML anchor shares one Template between Routes.
  #
  # Settings is code once it holds a Template: a Template runs on the server and can read every environment variable,
  # tokens included. Only let people trusted with the server edit this file, and set VITRINE_TEMPLATE_DISABLE to any
  # non-empty value, even false, to refuse: Routes then show their Controller's own page and the warning names them.
  #
  # A Template can use, with no import:
  #   - every Component, under its file name in src/components
  #   - source, group and project: the Route's values, undefined where a Route has none
  #   - path: the full Project path, on gitlab-project Routes, as project is only its last segment
  #   - title and description: those of the page, where the Controller has them
  #   - sources: each Source's name, type, url and projects or mainGroups, with no token or password
  #   - Astro, as in any Astro file, such as Astro.url
  #
  # Frontmatter, {…} expressions, free HTML, scoped <style> and <script> all work. Startup stops, naming the Route, on
  # a Template that does not compile, an unknown Component, a missing or unknown prop, a Component of the wrong Source
  # type, and a fixed source that does not exist or a fixed group or project outside every Main Group. Values computed
  # in {…} are not checked: an error there is logged, and Visitors see a short alert inside the page.
  #
  # Limits: `import` does not work, as project files do not exist in the build output. `client:*` islands do not work,
  # as they need the build. A Template cannot set a status code or redirect, and it cannot place the Controller's own
  # content: to keep part of it, place the same Components.
  - url: /overview
    controller: gitlab-group
    params:
      group: platform
    template: |
      ---
      const highlighted = ['platform/backend', 'platform/frontend'];
      ---
      <h1 class="overview">{title}</h1>
      <GitlabProjectList source={source} group={group} />
      {highlighted.map((path) => <GitlabGroupSummary source={source} group={path} />)}
      <style>
        .overview { text-transform: uppercase; }
      </style>
