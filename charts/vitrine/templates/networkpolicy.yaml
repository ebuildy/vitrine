{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vitrine.fullname" . }}
  labels:
    {{- include "vitrine.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vitrine.selectorLabels" . | nindent 6 }}
  # Both directions are always policed: a direction without rules lets nothing through.
  policyTypes:
    - Ingress
    - Egress
  {{- with .Values.networkPolicy.ingress }}
  ingress:
    {{- tpl . $ | nindent 4 }}
  {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- tpl . $ | nindent 4 }}
  {{- end }}
{{- end }}
