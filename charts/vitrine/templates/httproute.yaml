{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "vitrine.fullname" . }}
  labels:
    {{- include "vitrine.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "httpRoute.parentRefs needs at least one Gateway" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    - {{- omit . "backendRefs" | toYaml | nindent 6 }}
      backendRefs:
        - name: {{ include "vitrine.fullname" $ }}
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
