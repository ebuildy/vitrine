apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vitrine.fullname" . }}
  labels:
    {{- include "vitrine.labels" . | nindent 4 }}
data:
  settings.yaml: |
    {{- toYaml .Values.settings | nindent 4 }}
  {{- range $name, $content := .Values.extraFiles }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
