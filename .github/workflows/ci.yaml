name: Node.js CI

on:
  push:
  workflow_call:

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      # tests/helm-chart.test.ts renders and lints the chart.
      - uses: azure/setup-helm@v4
      - run: docker compose up -d --wait
      - run: npm ci
      - run: npm run check
      - run: npm run build --if-present
      - run: npm test
