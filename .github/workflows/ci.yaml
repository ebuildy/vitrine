name: Node.js CI

on:
  push:
  workflow_call:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - run: docker compose up -d --wait
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
