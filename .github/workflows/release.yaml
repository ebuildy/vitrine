name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    # RELEASE_PLEASE_TOKEN is a secret of this environment, which only main may use.
    environment: prod
    steps:
      # A fine-grained PAT, not GITHUB_TOKEN: a tag pushed with GITHUB_TOKEN does not trigger image.yaml.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
