name: Container image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml

  image:
    needs: tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ebuildy/vitrine
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build the image to smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          load: true
          tags: vitrine:smoke
      - name: Smoke test the image
        shell: bash
        run: |
          if output=$(docker run --rm vitrine:smoke 2>&1); then
            echo 'The image started without Settings' >&2
            exit 1
          fi
          echo "$output"
          grep --quiet 'Invalid Settings' <<<"$output"

          # Run as the Helm chart runs it: a read-only root, with /tmp alone writable, and no capabilities.
          docker run --detach --name vitrine-smoke --publish 8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --volume "$PWD/tests/fixtures/container-settings.yaml:/etc/vitrine/settings.yaml:ro" \
            vitrine:smoke
          trap 'docker logs vitrine-smoke; docker rm --force vitrine-smoke' EXIT
          page=$(curl --silent --show-error --fail --retry 20 --retry-all-errors --retry-delay 1 http://localhost:8080/)
          grep --quiet '<h1>Images</h1>' <<<"$page"
      - name: Build both platforms, from the same builder's cache
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # A release tag runs the chart workflow too, which no path of a tag push triggers.
  chart-tests:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/chart.yaml

  # The Helm chart of a release, at oci://ghcr.io/<owner>/charts/vitrine, once its Container image is pushed.
  # Its version and appVersion are those of the tag, so that image.tag defaults to the image of the same release.
  chart:
    needs: [image, chart-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
      - name: Package the chart, with the Valkey chart inside
        run: |
          helm repo add valkey https://valkey.io/valkey-helm/
          helm dependency build charts/vitrine
          version="${GITHUB_REF_NAME#v}"
          helm package charts/vitrine --version "$version" --app-version "$version" --destination "$RUNNER_TEMP"
          echo "PACKAGE=$RUNNER_TEMP/vitrine-$version.tgz" >> "$GITHUB_ENV"
      - name: Push the chart to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "$PACKAGE" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
