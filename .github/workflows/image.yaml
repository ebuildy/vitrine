name: Container image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml

  image:
    needs: tests
    runs-on: ubuntu-latest
    # A normal run takes about 2 minutes: a hang must not last the default 6 hours.
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ebuildy/vitrine
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - id: version
        name: Name the version the image reports
        run: echo "version=${{ steps.meta.outputs.version }}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build the image to smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          load: true
          tags: vitrine:smoke
          build-args: VERSION=${{ steps.version.outputs.version }}
      - name: Smoke test the image
        shell: bash
        run: |
          # A missing Settings file starts with defaults, and runs until stopped: so the invalid one is a file that declares no routes.
          printf 'sources: []\n' > "$RUNNER_TEMP/invalid-settings.yaml"
          # timeout: a run that does not exit fails the step, rather than freezing the job.
          if output=$(timeout 60 docker run --rm \
            --volume "$RUNNER_TEMP/invalid-settings.yaml:/etc/vitrine/settings.yaml:ro" vitrine:smoke 2>&1); then
            echo 'The image started with invalid Settings' >&2
            exit 1
          fi
          echo "$output"
          grep --quiet 'Invalid Settings' <<<"$output"
          grep --quiet --fixed-strings '"msg":"Starting Vitrine"' <<<"$output"

          # Run as the Helm chart runs it: a read-only root, with /tmp alone writable, and no capabilities.
          docker run --detach --name vitrine-smoke --publish 8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --volume "$PWD/tests/fixtures/container-settings.yaml:/etc/vitrine/settings.yaml:ro" \
            vitrine:smoke
          trap 'docker logs vitrine-smoke; docker rm --force vitrine-smoke' EXIT
          # --max-time: a server that accepts the connection but never answers must be retried, not waited on forever.
          page=$(curl --silent --show-error --fail --max-time 10 --retry 20 --retry-all-errors --retry-delay 1 http://localhost:8080/)
          grep --quiet '<h1>Images</h1>' <<<"$page"
      - name: Build both platforms, from the same builder's cache
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
